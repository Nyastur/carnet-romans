    :root {

    }

      display: grid;

      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));

      border: 1px solid rgba(158,115,56,.34);

      background: linear-gradient(180deg, rgba(17,7,7,.96), rgba(3,1,2,.96));

    if(!$("overview").value)$("lookupStatus").textContent="Fiche récupérée. Aucun résumé français disponible pour cette édition.";
    if(v.editionKey&&/^\/books\/OL\d+M$/.test(v.editionKey)){
     try{const detail=await fetchBookJSON("https://openlibrary.org"+v.editionKey+".json");if(chosenGeneration!==lookupGeneration)return;
      if(!$("pages").value)$("pages").value=detail.number_of_pages||"";
      if(!$("genre").value)applyCatalogueGenre(detail.subjects||[]);
      const description=frenchSummary(typeof detail.description==="string"?detail.description:detail.description?.value);
      if(description&&!$("overview").value){$("overview").value=description;$("lookupStatus").textContent="Informations et résumé français récupérés."}
     }catch{}
    }
    if(chosenGeneration===lookupGeneration&&!$("overview").value.trim())await supplementSummary(v,chosenGeneration);

   })();};const group=document.createElement("div");group.className="edition-result";group.append(btn);$("results").append(group);bindCoverErrors(group);
   if(v.workKey){const more=document.createElement("button");more.type="button";more.textContent="Autres éditions de « "+v.title+" »";more.className="edition-more";more.onclick=()=>showFrenchEditions(v);group.append(more)}
  });
}
$("lookup").onclick=async()=>{
 const q=$("title").value.trim();if(!q){$("lookupStatus").textContent="Entre d’abord un titre.";return}
 const generation=++lookupGeneration;$("lookup").disabled=true;$("results").innerHTML="";$("lookupStatus").textContent="Recherche des éditions…";
 try{
  const result=await searchRomanSources(q);if(generation!==lookupGeneration)return;
  $("lookupStatus").textContent=result.items.length?"Résultats "+result.source+" · Choisis le bon roman. Vérifie l’édition et le nombre de pages.":"Aucun résultat. Essaie le titre complet ou ajoute ton roman manuellement.";
  displayRomanChoices(result.items);
  if(result.items.length&&result.source==="Open Library")$("lookupStatus").textContent="Éditions françaises · Les plus récentes en premier. Recherche une saga ou un titre de tome pour affiner.";
 }catch(e){if(generation===lookupGeneration)$("lookupStatus").textContent="Les deux sources sont inaccessibles ("+e.message+"). Réessaie depuis le site GitHub Pages ou complète la fiche manuellement."}
 finally{$("lookup").disabled=false}
};

$("export").onclick=()=>{if(!ready){$("syncStatus").textContent="Attends la connexion avant d’exporter.";return}const blob=new Blob([JSON.stringify({source:"Carnet de romans",exportedAt:new Date().toISOString(),count:books.length,romans:books},null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="carnet-romans-"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
onSnapshot(booksCollection,snapshot=>{ready=true;books=snapshot.docs.map(d=>{const v=d.data();return {...v,id:d.id,title:v.title||"Sans titre",status:v.status||"À lire",rating:Number(v.rating)||0,pages:Number(v.pages)||0,currentPage:Number(v.currentPage)||0}});$("syncStatus").textContent="Bibliothèque synchronisée · Firebase";refreshFilters();render()},e=>{ready=false;$("syncStatus").textContent=errorMessage(e)});
render();
</script>
